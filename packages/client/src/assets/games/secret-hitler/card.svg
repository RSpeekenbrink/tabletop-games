<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Secret Hitler placeholder art">
  <defs>
    <linearGradient id="sh-bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#152233"/>
      <stop offset="0.55" stop-color="#1a1418"/>
      <stop offset="1" stop-color="#2c0c0c"/>
    </linearGradient>
    <radialGradient id="sh-glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#d4a23a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d4a23a" stop-opacity="0"/>
    </radialGradient>
    <polygon id="sh-ray" points="300,340 286,-220 314,-220" fill="#d4a23a"/>
  </defs>

  <!-- base -->
  <rect width="600" height="800" fill="url(#sh-bg)"/>

  <!-- sunburst -->
  <g opacity="0.16">
    <use href="#sh-ray" transform="rotate(0 300 340)"/>
    <use href="#sh-ray" transform="rotate(30 300 340)"/>
    <use href="#sh-ray" transform="rotate(60 300 340)"/>
    <use href="#sh-ray" transform="rotate(90 300 340)"/>
    <use href="#sh-ray" transform="rotate(120 300 340)"/>
    <use href="#sh-ray" transform="rotate(150 300 340)"/>
    <use href="#sh-ray" transform="rotate(180 300 340)"/>
    <use href="#sh-ray" transform="rotate(210 300 340)"/>
    <use href="#sh-ray" transform="rotate(240 300 340)"/>
    <use href="#sh-ray" transform="rotate(270 300 340)"/>
    <use href="#sh-ray" transform="rotate(300 300 340)"/>
    <use href="#sh-ray" transform="rotate(330 300 340)"/>
  </g>

  <rect width="600" height="800" fill="url(#sh-glow)"/>

  <!-- art-deco wing chevrons flanking the medallion -->
  <g fill="#d4a23a" opacity="0.55">
    <path d="M70 340 l70 -26 0 18 -52 18 52 18 0 18z"/>
    <path d="M530 340 l-70 -26 0 18 52 18 -52 18 0 18z"/>
  </g>

  <!-- medallion -->
  <circle cx="300" cy="340" r="156" fill="#0d141d"/>
  <circle cx="300" cy="340" r="156" fill="none" stroke="#d4a23a" stroke-width="4"/>
  <circle cx="300" cy="340" r="138" fill="none" stroke="#d4a23a" stroke-width="1.5" opacity="0.6"/>

  <!-- anonymous bust: the "secret" identity -->
  <g>
    <path d="M300 232
             a52 52 0 1 0 0.1 0 z
             M214 452
             a86 78 0 0 1 172 0 z" fill="#05080c"/>
    <!-- shadowed brim hiding the face -->
    <path d="M236 300 q64 -34 128 0 l0 16 q-64 -22 -128 0 z" fill="#000" opacity="0.85"/>
    <text x="300" y="322" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-size="86" font-weight="700" fill="#d4a23a" opacity="0.9">?</text>
  </g>

  <!-- deco frame -->
  <rect x="26" y="26" width="548" height="748" fill="none" stroke="#d4a23a" stroke-width="2" opacity="0.45"/>
  <rect x="34" y="34" width="532" height="732" fill="none" stroke="#d4a23a" stroke-width="1" opacity="0.25"/>

  <!-- bottom vignette so overlaid title stays legible -->
  <rect x="0" y="560" width="600" height="240" fill="#06060a" opacity="0.65"/>
</svg>
